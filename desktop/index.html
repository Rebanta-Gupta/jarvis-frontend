<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<div class="desktop-app" id="app">

  <!-- Left sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">J</div>
    <nav class="sidebar-nav">
      <button class="sidebar-btn active" data-screen="orb" title="Jarvis">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="3" fill="currentColor" opacity="0.5"/></svg>
      </button>
      <button class="sidebar-btn" data-screen="chat" title="Chat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 4h14v10H3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 17l3-3h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="sidebar-btn" data-screen="notes" title="Notes">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="sidebar-btn" data-screen="reminders" title="Reminders">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3a7 7 0 100 14A7 7 0 0010 3z" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <!-- Status dot -->
      <div class="sidebar-status">
        <div class="status-dot" id="statusDot"></div>
      </div>
      <button class="sidebar-btn" data-screen="settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">

    <!-- ORB SCREEN -->
    <div class="screen active" id="screen-orb">
      <div class="orb-screen orb-screen-desktop">
        <canvas id="orbCanvas" width="300" height="300"></canvas>
        <div class="orb-status">
          <span class="orb-label" id="orbLabel">Idle</span>
          <span class="orb-sub" id="orbSub">Say "Hey Jarvis"</span>
        </div>
        <div class="status-txt-desktop" id="statusTxt">not configured</div>
      </div>
    </div>

    <!-- CHAT SCREEN -->
    <div class="screen" id="screen-chat">
      <div class="screen-header">
        <span class="screen-title">Chat</span>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="header-btn" id="btnVoiceMode" title="Toggle voice mode">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
              <path d="M5 10a7 7 0 0014 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="header-btn" id="btnResetChat" title="Clear conversation">↺</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row" id="chatTextRow">
        <input class="chat-input" id="chatInput" type="text" placeholder="Message Jarvis..." autocomplete="off"/>
        <button class="chat-send" id="chatSend">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M14 8L2 2l2.5 6L2 14l12-6z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="chat-voice-row" id="chatVoiceRow" style="display:none">
        <span class="voice-hint">Hold to speak, release to send</span>
        <button class="voice-hold-btn" id="chatMic" aria-label="Hold to speak">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
            <path d="M5 10a7 7 0 0014 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- NOTES SCREEN -->
    <div class="screen" id="screen-notes">
      <div class="screen-header">
        <span class="screen-title">Notes</span>
        <button class="header-btn" id="btnAddNote">+</button>
      </div>
      <div class="search-row">
        <input class="search-input" id="notesSearch" type="text" placeholder="Search notes..."/>
      </div>
      <div class="list-container" id="notesList"></div>
    </div>

    <!-- REMINDERS SCREEN -->
    <div class="screen" id="screen-reminders">
      <div class="screen-header">
        <span class="screen-title">Reminders</span>
        <button class="header-btn" id="btnAddReminder">+</button>
      </div>
      <div class="list-container" id="remindersList"></div>
    </div>

    <!-- SETTINGS SCREEN -->
    <div class="screen" id="screen-settings">
      <div class="screen-header"><span class="screen-title">Settings</span></div>
      <div class="settings-body">
        <div class="settings-group">
          <label class="settings-label">Backend URL</label>
          <input class="settings-input" id="settingsUrl" type="text" placeholder="https://jarvis-nogm.onrender.com"/>
        </div>
        <div class="settings-group">
          <label class="settings-label">API Key</label>
          <input class="settings-input" id="settingsKey" type="password" placeholder="your-jarvis-api-key"/>
        </div>
        <div class="settings-group">
          <label class="settings-label">Theme</label>
          <div class="theme-toggle">
            <button class="theme-btn active" id="themeDark">Dark</button>
            <button class="theme-btn" id="themeLight">Light</button>
          </div>
        </div>
        <button class="save-btn" id="btnSaveSettings">Save Settings</button>
        <div class="settings-status" id="settingsStatus"></div>
        <div class="settings-divider">Connection</div>
        <button class="test-btn" id="btnTestConnection">Test Connection</button>
        <div class="connection-status" id="connectionStatus"></div>
      </div>
    </div>

  </main>
</div>
<script src="app.js"></script>
<script>
  // Override nav for desktop sidebar
  document.querySelectorAll('.sidebar-btn[data-screen]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.sidebar-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });
</script>
</body>
</html>
